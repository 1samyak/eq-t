<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141412"><meta name="description" content="EQ-T — an AI-native equity research layer by SARETY. Startup Buildathon India 2026 pitch."><title>EQ-T — Startup Buildathon India 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--paper:#f6f4ef;--ink:#171715;--muted:#77756e;--line:#d8d5cd;--green:#0b913c;--dark:#141412;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:#222;color:var(--ink);font-family:Manrope, sans-serif}.top{position:fixed;z-index:5;top:0;left:0;right:0;height:5px;background:#555}.bar{height:5px;background:var(--green);width:8.33%;transition:width .25s}.deck{min-height:100vh;display:grid;place-items:center;padding:38px 18px 90px}.slide{display:none;position:relative;width:min(1200px,100%);min-height:min(760px,calc(100vh - 150px));background:var(--paper);padding:clamp(28px,5vw,76px);overflow:hidden;box-shadow:0 20px 80px #0006}.slide.active{display:flex;flex-direction:column}.slide.dark{background:var(--dark);color:var(--white);--line:#383731;--muted:#aaa79e}.slide.green{background:#087b35;color:white;--line:#ffffff44;--muted:#d8f4df}.eyebrow,.kicker,.foot,.tag{font:11px 'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase}.eyebrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1,h2{font-family:Sora,Manrope,sans-serif;letter-spacing:-.045em}h1{font-size:clamp(42px,6.5vw,82px);line-height:1.02;max-width:850px;margin:55px 0 24px}h2{font-size:clamp(34px,4.5vw,58px);line-height:1.08;margin:28px 0 16px}h3{font-size:17px;margin:0 0 10px}.lead{font-size:clamp(17px,2vw,22px);line-height:1.55;max-width:850px;color:var(--muted)}.dark .lead,.green .lead{color:#d4d2ca}.kicker{color:var(--green);margin:34px 0 10px}.dark .kicker,.green .kicker{color:#80e6a0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:28px 0}.card{border:1px solid var(--line);padding:20px;min-height:115px}.card p{font-size:14px;line-height:1.6;color:var(--muted);margin:0}.num{font:12px 'DM Mono';color:var(--green);margin-bottom:12px}.dark .num,.green .num{color:#80e6a0}.quote{border-left:3px solid var(--green);padding:14px 22px;font-size:clamp(18px,2.2vw,26px);line-height:1.45;margin:28px 0;max-width:900px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto;padding-top:30px}.step{border-top:1px solid var(--line);padding-top:13px;font:12px 'DM Mono';color:var(--muted)}.step b{display:block;color:var(--ink);font:700 14px Manrope;margin-bottom:5px}.dark .step b,.green .step b{color:white}.foot{margin-top:auto;padding-top:25px;border-top:1px solid var(--line);color:var(--muted);display:flex;justify-content:space-between;gap:20px}.metric{font:700 clamp(30px,4vw,48px) Sora;color:var(--green)}.dark .metric,.green .metric{color:#80e6a0}.small{font-size:12px;color:var(--muted);line-height:1.5}.wide{grid-column:1/-1}.controls{position:fixed;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#111e;padding:9px 14px;border:1px solid #ffffff2a;border-radius:40px;color:white;backdrop-filter:blur(10px)}button{background:#ffffff18;color:white;border:1px solid #ffffff35;border-radius:24px;padding:10px 17px;font:12px Manrope;cursor:pointer}button:hover{background:#ffffff30}.count{font:12px 'DM Mono';min-width:55px;text-align:center}.hint{position:fixed;right:20px;bottom:26px;color:#ddd9;font:10px 'DM Mono'}@media(max-width:650px){.deck{padding:15px 10px 90px}.slide{min-height:calc(100vh - 125px);padding:25px 22px}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.eyebrow{font-size:9px}.foot{font-size:9px}.hint{display:none}}@media print{body{background:white}.deck{display:block;padding:0}.slide,.slide.active{display:flex!important;page-break-after:always;min-height:100vh;box-shadow:none}.controls,.top,.hint{display:none}}
</style></head><body><div class="top"><div class="bar" id="bar"></div></div><main class="deck" id="deck"></main><div class="controls"><button id="prev" aria-label="Previous slide">←</button><span class="count" id="count">01 / 12</span><button id="next" aria-label="Next slide">NEXT →</button></div><div class="hint">← → TO NAVIGATE · F FULLSCREEN · P PRINT</div>
<script>
const slides=[
{theme:"dark",tag:"Startup Buildathon India · 2026",title:"Turn hours of research into a defensible answer.",lead:"EQ-T helps equity analysts move from scattered filings to cited, reviewable insight—without losing the source, calculation or caveat behind the conclusion.",quote:"“What changed in earnings quality this quarter—and which disclosures support the explanation?”",cards:[["01 / FIND","Locate relevant filing evidence"],["02 / TEST","Reconcile financial signals"],["03 / EXPLAIN","Build a traceable research view"]],label:"SOURCE-LINKED RESEARCH · A SARETY PRODUCT"},
{tag:"01 — The problem",title:"The research bottleneck",lead:"Analysts don't lack data. They lack a defensible trail. Hours disappear into finding, reconciling and citing evidence before an analyst can form a view.",cards:[["01 · SCATTERED SOURCES","Annual reports, quarterly results, exchange disclosures and management commentary live in different places and formats."],["02 · MANUAL RECONCILIATION","Analysts normalize periods, compare statements and verify line items before interpretation can begin."],["03 · SIGNALS GET MISSED","Cash-flow divergence, working-capital movements and disclosure changes need deliberate cross-checking."],["04 · EVIDENCE GETS LOST","Source references, calculations and assumptions can become detached from the final research narrative."]],note:"Problem framing from the EQ-T product brief; no time-savings claim is asserted."},
{theme:"soft",tag:"02 — Initial customer",title:"A narrow starting point",lead:"AI can summarize financials. Research needs verification. A number without its source is hard to audit; a conclusion without its calculation is hard to defend.",cards:[["IDEAL CUSTOMER","Independent equity research analyst working across a defined set of listed companies."],["JOB TO BE DONE","Assess a company after quarterly results without rebuilding the evidence trail by hand."],["ILLUSTRATIVE WORKFLOW","Read the filing → reconcile reported financials → investigate cash and working-capital signals → document."],["DESIRED OUTPUT","Answer + calculation + filing reference + caveat"]],quote:"“Revenue grew. What explains the change in operating cash conversion?”",note:"Initial audience defined in the supplied EQ-T deck; persona and workflow are illustrative."},
{tag:"03 — The product",title:"From financial data to defensible intelligence.",lead:"EQ-T connects disclosures, structured financial data, document intelligence, forensic accounting and thesis development in one research layer.",cards:[["01 / RESEARCH COPILOT","Ask company-specific questions across filings and structured financials, with answers linked to supporting evidence. Retrieve · Explain · Cite"],["02 / FORENSIC ACCOUNTING","Run deterministic checks for cash-flow divergence, receivables, inventory and other earnings-quality signals. Test · Compare · Flag"],["03 / SARETY SCORE","Turn verified findings into structured research notes, risk signals and a repeatable thesis workflow. Structure · Compare · Review"]],quote:"Analyst judgement stays human. EQ-T makes the evidence more systematic.",note:"SARETY Score and parts of the platform are planned capabilities, not represented as production-complete."},
{theme:"dark",tag:"04 — Product workflow",title:"From one question to a cited research lead.",lead:"Illustrative company research workspace · sample placeholders",cards:[["ASK EQ-T","Why did operating cash conversion change in [period]?"],["REVENUE TREND","[Period values] · source required"],["OPERATING CASH FLOW","[Period values] · source required"],["RECEIVABLES + INVENTORY","Compare movements with revenue and operating cash flow."],["EVIDENCE","Annual report · Note [xx] · Page [xx] · Table [xx]"],["REVIEW SIGNAL","Not an investment conclusion. Confirm period definitions, notes and classification changes."]],steps:["FIND filing evidence","NORMALIZE figures","TEST accounting signals","EXPLAIN with citations"],note:"Designed workflow illustration. Company, period, values and page references are placeholders—not real market data or a claim of a working end-to-end feature."},
{theme:"soft",tag:"05 — Technology & Google AI",title:"AI reads the filing. Financial logic tests the numbers.",lead:"Proposed Buildathon architecture",cards:[["01 / INPUT","Annual reports, quarterly results and exchange filings; structured financial data where licensed."],["02 / PARSE","Parse PDF text, tables and page context into structured fields. Proposed: Gemini / Document AI."],["03 / NORMALIZE","Map periods, units, line items and standalone versus consolidated values. Deterministic validation."],["04 / RETRIEVE","Index passages with company, period, document, page and table metadata. Proposed: Vertex AI retrieval."],["05 / ANALYZE","Calculate financial tests in code; use Gemini to explain retrieved evidence with structured output."],["06 / SERVE","Return finding, formula, source reference, uncertainty and analyst review state."]],note:"Proposed—not claimed live. The supplied HTML contains no backend, deployment configuration or evidence of a live Google integration."},
{tag:"06 — Competitive context",title:"Existing tools help analysts find data. EQ-T aims to help defend the conclusion.",lead:"Positioning, not a feature checklist",cards:[["SCREENER.IN","Indian company financials, long history, custom queries, announcements and filings. EQ-T intends to connect forensic checks with underlying disclosures."],["TRENDLYNE","Screeners, stock scores, alerts, consensus estimates, reports and portfolio tools. EQ-T intends a source-linked reasoning trail around accounting quality."],["QUARTR","Global IR documents, filings, transcript search, AI chat and event workflows. EQ-T starts with Indian company research and financial-quality checks."],["FISCAL.AI","Financials, ratios, filing sourcing, segments, KPIs, consensus and related APIs. EQ-T emphasizes repeatable forensic tests and thesis evidence."]],note:"Public feature descriptions—not a full parity audit. EQ-T's intended emphasis is not an assertion that competitors lack comparable functionality."},
{theme:"soft",tag:"07 — Market & business model",title:"Start with paid research work. Expand with the workflow.",lead:"Bottom-up sizing model. Build the market from reachable buyers.",cards:[["2,329","Research Analysts"],["1,071","Investment Advisers"],["544","Portfolio Managers"],["62","Mutual Funds"],["TAM","N₁ relevant analyst / investment seats × annual spend per seat"],["SAM","N₂ reachable Indian organisations × eligible seats × annual contract value"],["SOM","Near-term design-partner conversions × expected annual account value"],["MONETIZATION","Entry: individual discovery. Core: analyst pro. Expansion: research teams and institutions."]],note:"SEBI registration snapshot stated in supplied deck as of 31 Oct 2026. Categories may overlap and are not unique paying customers; validate account universe, budget owner, pricing and adoption assumptions."},
{tag:"08 — Stage & validation",title:"Evidence before claims. Prove the next step.",lead:"Be precise about what exists.",cards:[["DEFINED · INITIAL SCOPE","A focused starting universe of 10 Indian listed companies is described as the initial coverage scope."],["DEFINED · METHODOLOGY","A 10-stage Thesis Engine is specified as a proposed framework; checks and scoring weights remain subject to validation."],["NOT EVIDENCED · TRACTION","No verifiable paying customers, pilot outcomes, production Google AI integration, benchmark results or cloud deployment were supplied."],["NEXT PROOF POINT","10 companies. 50 analyst questions. Benchmark citation accuracy, calculation correctness, answer usefulness and analyst review time."]],note:"Assessment is limited to the supplied HTML deck and brief; no separate code repository or product telemetry was provided."},
{theme:"dark",tag:"09 — Go-to-market",title:"Win the analyst first. Expand when the workflow proves value.",lead:"Earn trust in a narrow workflow.",cards:[["01 · RECRUIT DESIGN PARTNERS","Start with independent analysts and small research teams who can test a specific filing-review task."],["02 · PROVE WORKFLOW UTILITY","Run structured trials on selected disclosures; collect feedback on accuracy, citations and usability."],["03 · CONVERT AND EXPAND","Package recurring individual workflows, then extend to team coverage and institutional integrations."],["MEASURE A","Time to locate and verify source evidence."],["MEASURE B","Share of answer claims with usable citations."],["MEASURE C + D","Analyst acceptance and correction rate; repeat use and willingness to pay."]],note:"Go-to-market and pilot metrics are proposed; no pilot or customer validation is claimed."},
{tag:"10 — Buildathon execution",title:"Two days. One end-to-end proof.",lead:"20–21 November 2026 · two-day city buildathon. Build the smallest useful workflow that turns one company filing into a cited research finding—and measure whether an analyst can trust it.",cards:[["DAY 01 · SCOPE / DESIGN / CONNECT","Choose one public filing and one accounting question. Use Gemini document understanding to parse relevant content and tables. Normalize financial fields and store page-level source references."],["DAY 01 OUTPUT","Structured evidence from one filing."],["DAY 02 · BUILD / TEST / SHOWCASE","Run deterministic checks for a cash-flow or working-capital signal. Use Gemini to explain retrieved evidence. Show answer, calculation, filing page and analyst review state."],["DAY 02 OUTPUT","A working filing-to-evidence demo."]],note:"Official Startup Buildathon dates and milestones as stated in supplied deck; verify event details before external submission."},
{theme:"green",tag:"11 — Founder & close",title:"Make every research conclusion traceable.",lead:"EQ-T aims to make institutional-quality equity research more systematic: the source, the calculation and the reasoning should travel together.",quote:"Validate EQ-T on 10 companies, 50 analyst questions and a measurable citation-accuracy benchmark.",cards:[["SAMYAK JAIN","Founder · SARETY"],["BACKGROUND","B.Tech Data Science, Quantum University · Diploma in Programming, IIT Madras."],["BUILDING AT THE INTERSECTION","Data science · RAG systems · Software engineering · Equity research"],["CONTACT","eq-t.com · SARETY · EQ-T Institutional Financial Intelligence"]]}
];
const root=document.getElementById('deck');
slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+(s.theme||'');let cards=(s.cards||[]).map((c,j)=>'<article class="card"><div class="num">'+(String(j+1).padStart(2,'0'))+'</div><h3>'+c[0]+'</h3><p>'+c[1]+'</p></article>').join('');let steps=s.steps?'<div class="steps">'+s.steps.map(x=>'<div class="step">'+x+'</div>').join('')+'</div>':'';el.innerHTML='<div class="eyebrow"><span>EQ-T / A SARETY PRODUCT</span><span>'+s.tag+'</span></div><div class="kicker">EQUITY INTELLIGENCE PLATFORM</div><h2>'+s.title+'</h2><p class="lead">'+s.lead+'</p>'+(s.quote?'<div class="quote">'+s.quote+'</div>':'')+'<div class="grid">'+cards+'</div>'+steps+(s.note?'<p class="small">'+s.note+'</p>':'')+'<div class="foot"><span>EQ-T · INSTITUTIONAL FINANCIAL INTELLIGENCE</span><span>'+String(i+1).padStart(2,'0')+' / 12</span></div>';root.appendChild(el)});
let current=0;const all=[...document.querySelectorAll('.slide')];function show(n){current=Math.max(0,Math.min(all.length-1,n));all.forEach((x,i)=>x.classList.toggle('active',i===current));document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / 12';document.getElementById('bar').style.width=((current+1)/12*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===11?'RESTART ↻':'NEXT →'}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current===11?0:current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(current===11?0:current+1)}if(e.key==='ArrowLeft'){show(current-1)}if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}if(e.key.toLowerCase()==='p'){window.print()}});show(0);
</script></body></html>
